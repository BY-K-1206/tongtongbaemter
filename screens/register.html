<!-- ============ SCREEN: REGISTER (지문 목록 관리) ============ -->
  <section id="screen-register" class="screen">
    <div id="register-top-bar">
      <button id="btn-back-home-from-register" class="btn btn-ghost btn-small" type="button">&larr; 홈</button>
    </div>

    <div class="clay-panel" id="register-list-panel">
      <div class="panel-header-row" id="register-panel-header-row">
        <p class="panel-eyebrow" id="register-panel-eyebrow">MY PASSAGES</p>
        <h2 id="register-h2">지문 목록</h2>
      </div>

      <div id="register-toolbar">
        <input type="search" id="register-search" placeholder="제목·태그 검색" autocomplete="off">
        <select id="register-sort" aria-label="정렬 기준">
          <option value="newest" selected id="register-option">등록일 최신순</option>
          <option value="oldest" id="register-option-2">등록일 오래된순</option>
          <option value="hardest" id="register-option-3">난이도 어려운순</option>
          <option value="easiest" id="register-option-4">난이도 쉬운순</option>
        </select>
        <button id="btn-goto-add-passage" class="btn-icon-add" type="button" title="지문 추가하기" aria-label="지문 추가하기">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" id="register-svg">
            <path fill="currentColor" d="M12 5a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2h-5v5a1 1 0 1 1-2 0v-5H6a1 1 0 1 1 0-2h5V6a1 1 0 0 1 1-1z" id="register-path"/>
          </svg>
        </button>
      </div>

      <p id="register-list-empty">「+」 버튼으로 새 지문을 등록해보세요.</p>
      <div id="register-list"></div>
    </div>
  </section>


<!-- live-server-inject-anchor: keep Live Server out of inline SVG -->
<body hidden aria-hidden="true" id="live-server-inject-body-register"></body>
