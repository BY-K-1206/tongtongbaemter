<!-- ============ SCREEN: ADMIN ============ -->
  <section id="screen-admin" class="screen">
    <div id="admin-top-bar">
      <button id="btn-back-home-from-admin" class="btn btn-ghost btn-small" type="button">&larr; 홈</button>
      <h2 id="admin-title">관리자</h2>
    </div>

    <div class="clay-panel" id="admin-boa-panel">
      <header id="admin-boa-header">
        <h1 id="admin-boa-heading">보아뱀 상태</h1>
        <p id="admin-boa-subtitle">이름과 성장 기준(최고 WPM)을 바꾸고, 상태마다 이미지를 올릴 수 있어요. 이미지가 없으면 홈 카드는 지금처럼 도형 보아를 씁니다.</p>
      </header>
      <p id="admin-boa-status" class="info-text" hidden></p>
      <div id="admin-boa-list"></div>
      <div id="admin-boa-actions">
        <button type="button" class="btn btn-primary" id="btn-admin-boa-save">보아 상태 저장</button>
        <button type="button" class="btn btn-ghost" id="btn-admin-boa-reset">기본값으로</button>
      </div>
    </div>

    <div class="clay-panel" id="admin-panel">
      <header id="admin-header">
        <h1 id="admin-heading">사용자</h1>
        <p id="admin-subtitle">역할은 user / admin만 사용합니다. lecturer·챌린지는 나중에.</p>
      </header>

      <p id="admin-status" class="info-text" hidden></p>
      <div id="admin-user-list"></div>
      <p id="admin-empty" class="info-text" hidden>사용자가 없습니다.</p>
    </div>
  </section>
